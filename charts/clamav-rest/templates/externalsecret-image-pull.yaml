{{- if and .Values.imageRepositoryCredential.create .Values.imageRepositoryCredential.name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.imageRepositoryCredential.name }}
  labels:
    {{- include "clamav-rest.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
spec:
  refreshInterval: {{ .Values.imageRepositoryCredential.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.imageRepositoryCredential.clusterStore }}
  target:
    name: {{ .Values.imageRepositoryCredential.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: "{{ `{{ .dockerConfigJson }}` }}"
  data:
    - secretKey: dockerConfigJson
      remoteRef:
        key: {{ .Values.imageRepositoryCredential.dockerConfigJsonVaultPath }}
        property: json
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
