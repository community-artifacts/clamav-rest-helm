{{- if and .Values.proxy.password (not .Values.proxy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clamav-rest.fullname" . }}-proxy
  labels:
    {{- include "clamav-rest.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.proxy.existingSecretKey | default "proxy-password" }}: {{ .Values.proxy.password | b64enc | quote }}
{{- end }}
{{- if and .Values.tls.enabled .Values.tls.cert .Values.tls.key (not .Values.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clamav-rest.fullname" . }}-tls
  labels:
    {{- include "clamav-rest.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}
